<style>
  .robot-high-score__alliance {
    color: #fff;
    padding: .75rem;
    box-sizing: border-box;
    width: 100%;
  }

  .robot-high-score__red,
  .robot-high-score__blue {
    display: grid;
    align-items: stretch;
  }

  .robot-high-score__red {
    background: #dc3545;
    border-radius: .25rem 0 0 .25rem;
    grid-template-columns: 1fr auto;
    column-gap: 1rem;
  }

  .robot-high-score__blue {
    background: #007bff;
    border-radius: 0 .25rem .25rem 0;
    grid-template-columns: auto 1fr;
    column-gap: 1rem;
  }

  .robot-high-score__teams {
    display: flex;
    align-items: flex-start;
  }

  .robot-high-score__blue .robot-high-score__teams {
    justify-content: flex-end;
    text-align: right;
  }

  .robot-high-score__score {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 .5rem;
  }

  .robot-high-score__breakdown--tall {
    display: flex;
    flex-direction: column;
    gap: .15rem;
  }

  .robot-high-score__info {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #343a40;
    color: #fff;
    padding: .75rem;
    text-align: center;
  }

  .robot-high-score__info[hidden] {
    display: none;
  }

  .robot-high-score .row {
    display: flex;
    align-items: stretch;
  }

  .robot-high-score .row > [class*="col-"] {
    display: flex;
  }

  .robot-high-score .row > [class*="col-"] > .robot-high-score__alliance,
  .robot-high-score .row > [class*="col-"] > .robot-high-score__info {
    flex: 1;
  }
</style>

<script>
  window.robotMatchBreakdown = window.robotMatchBreakdown || (() => {
    const esc = value => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const teamList = (alliance, team) =>
      (alliance?.team_keys || []).map(key => {
        const number = key.replace(/^frc/, "");
        return key === team ? `<strong>${esc(number)}</strong>` : esc(number);
      }).join(" · ");

    const breakdown = (alliance, details, height) => {
      const values = [
        `Auto: ${esc(details?.totalAutoPoints ?? "—")}`,
        `Teleop: ${esc(details?.totalTeleopPoints ?? "—")}`,
        `Penalty: ${esc(details?.foulPoints ?? "—")}`
      ];

      return `<div class="robot-high-score__breakdown${height === "tall" ? " robot-high-score__breakdown--tall" : ""}">${values.map(value => `<span>${value}</span>`).join(height === "short" ? " · " : "")}</div>`;
    };

    const render = (match, team, options = {}) => {
      const height = options.height || "tall";
      const showInfo = options.info !== false;
      const eventName = options.eventName || match?.event_key || "";
      const matchName = options.matchName || `${match?.comp_level || "Match"} ${match?.match_number ?? ""}`;
      const red = match?.alliances?.red || {};
      const blue = match?.alliances?.blue || {};
      const scoreBreakdown = match?.score_breakdown || {};

      return `
        <div class="row align-items-stretch robot-high-score__breakdown-row">
          <div class="col-md-${showInfo ? "3" : "6"} pr-0">
            <div class="robot-high-score__alliance robot-high-score__red">
              <div class="robot-high-score__teams d-block mb-0">
                <h5>${teamList(red, team)}</h5>
                <h6 class="mb-0">${breakdown(red, scoreBreakdown.red, height)}</h6>
              </div>
              <div class="robot-high-score__score">
                <h3 class="mb-0">${esc(red.score ?? "—")}</h3>
              </div>
            </div>
          </div>
          ${showInfo ? `
          <div class="col-md-6 p-0">
            <div class="robot-high-score__info">
              <div>
                <h5>${esc(eventName)}</h5>
                <h6 class="mb-0">${esc(matchName)}</h6>
              </div>
            </div>
          </div>` : ""}
          <div class="col-md-${showInfo ? "3" : "6"} pl-0 text-right">
            <div class="robot-high-score__alliance robot-high-score__blue">
              <div class="robot-high-score__score">
                <h3 class="mb-0">${esc(blue.score ?? "—")}</h3>
              </div>
              <div class="robot-high-score__teams d-block">
                <h5>${teamList(blue, team)}</h5>
                <h6 class="mb-0">${breakdown(blue, scoreBreakdown.blue, height)}</h6>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    return { render };
  })();
</script>
