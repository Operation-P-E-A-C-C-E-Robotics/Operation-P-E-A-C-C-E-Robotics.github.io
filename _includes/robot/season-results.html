<section class="robot-season-results mb-5" data-year="{{ include.year }}" data-team="{{ include.team }}">
  {% include robot/match-table.html %}
  {% include robot/match-breakdown.html %}

  <style>
    /* ============================================================
       Event cards
       ============================================================ */

    .robot-season-results__event {
      border: 1px solid rgba(0, 0, 0, .15);
      border-radius: .5rem;
      background: #fff;
      color: #212529;
      margin-bottom: .75rem;
      overflow: hidden;
    }

    .robot-season-results__summary {
      position: relative;
      display: grid;
      grid-template-columns:
        minmax(220px, 2fr)
        repeat(4, minmax(110px, 1fr));
      gap: .75rem;
      align-items: center;
      padding: 1rem 2.5rem 1rem 1rem;
      cursor: pointer;
    }

    .robot-season-results__summary:hover {
      background: #f8f9fa;
    }

    .robot-season-results__name {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .robot-season-results__meta {
      color: #6c757d;
      font-size: .875rem;
    }

    .robot-season-results__label {
      display: block;
      color: #6c757d;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .robot-season-results__body {
      display: none;
      border-top: 1px solid rgba(0, 0, 0, .1);
      padding: 1rem;
      background: #f8f9fa;
    }

    .robot-season-results__event.is-open .robot-season-results__body {
      display: block;
    }

    .robot-season-results__chevron {
      position: absolute;
      top: 50%;
      right: 1rem;
      transform: translateY(-50%);
      transition: transform .15s ease;
    }

    .robot-season-results__event.is-open .robot-season-results__chevron {
      transform: translateY(-50%) rotate(180deg);
    }

    .robot-season-results__detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .75rem;
      margin-bottom: 1rem;
    }

    .robot-season-results__detail {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .1);
      border-radius: .35rem;
      padding: .75rem;
    }

    .robot-season-results__copr-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0 .75rem;
      margin-top: .5rem;
      border-top: 1px solid rgba(0, 0, 0, .08);
    }

    .robot-season-results__copr-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .35rem .5rem;
      border-bottom: 1px solid rgba(0, 0, 0, .08);
    }

    .robot-season-results__copr-row:last-child {
      border-bottom: 0;
    }

    .robot-season-results__copr-row strong {
      white-space: nowrap;
    }


    .robot-season-results__event-card,
    .robot-season-results__high-score {
      height: 100%;
      min-width: 0;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .1);
      border-radius: .35rem;
      padding: .75rem;
    }

    .robot-season-results__high-score {
      background: #f8f9fa;
    }

    .robot-season-results__high-score .embed-responsive {
      margin-top: .75rem;
    }

    .robot-season-results__high-score iframe {
      border: 0;
    }

    .robot-season-results__high-score > .embed-responsive {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      overflow: hidden;
    }

    .robot-season-results__high-score > .embed-responsive iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .robot-season-results__event-card,
    .robot-season-results__high-score {
      overflow-wrap: anywhere;
    }

    .robot-season-results__alliance {
      border-left: 4px solid #6c757d;
      background: #fff;
      padding: .75rem;
      margin-bottom: 1rem;
    }

    .robot-season-results__alliance.is-team {
      border-left-color: #0f4bcb;
    }

    .robot-season-results__alliance-teams {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .5rem;
    }

    .robot-season-results__alliance-team {
      display: inline-block;
      padding: .25rem .5rem;
      border-radius: .25rem;
      background: #f8f9fa;
      color: inherit;
      text-decoration: none;
    }

    .robot-season-results__alliance-team:hover {
      text-decoration: underline;
    }

    .robot-season-results__alliance-team.is-team {
      font-weight: 700;
      background: #e9ecef;
    }

    .robot-season-results__empty {
      padding: 2rem;
      text-align: center;
      color: #6c757d;
    }


    @media (max-width: 991.98px) {

      .robot-season-results__summary {
        grid-template-columns: 1fr 1fr;
      }

      .robot-season-results__summary > :last-child {
        position: absolute;
      }

      .robot-season-results__detail-grid {
        grid-template-columns: 1fr 1fr;
      }


      /* ----------------------------------------------------------
         Exact TBA mobile grid
         ----------------------------------------------------------

         TBA:
           grid-cols-[2.5em_7em_repeat(4,1fr)]
           grid-rows-[2em_2em]

         Column 1 = video
         Column 2 = match
         Columns 3-5 = teams
         Column 6 = score

         Row 1 = red
         Row 2 = blue
         ---------------------------------------------------------- */

      .robot-season-results__match {
        grid-template-columns:
          2.5em
          9em
          repeat(4, minmax(0, 1fr));

        grid-template-rows:
          2em
          2em;
      }


    }


    /* ============================================================
       Small phones
       ============================================================ */

    @media (max-width: 575.98px) {

      .robot-season-results__summary,
      .robot-season-results__detail-grid {
        grid-template-columns: 1fr;
      }

      .robot-season-results__summary > :last-child {
        grid-column: auto;
        grid-row: auto;
      }

    }
  </style>

  <div id="robotSeasonResults-{{ include.year }}">
    <div class="robot-season-results__empty">
      Loading event results…
    </div>
  </div>


  <script>
  (() => {
    const root = document.querySelector(
      `.robot-season-results[data-year="{{ include.year }}"]`
    );

    const output = document.getElementById(
      "robotSeasonResults-{{ include.year }}"
    );

    const year = "{{ include.year }}";
    const team = "{{ include.team }}";

    const base = "{{ '/data/tba/' | relative_url }}";

    const urls = {
      events: `${base}${year}_events.json`,
      statuses: `${base}${year}_event_statuses.json`,
      matches: `${base}${year}_matches.json`,
      awards: `${base}${year}_awards.json`,
      statistics: eventKey => `${base}${eventKey}_statistics.json`
    };


    /* ============================================================
       Helpers
       ============================================================ */

    const esc = value => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const teamNumber =
      team.replace(/^frc/, "");


    function recordText(record) {
      if (!record) return "—";

      if (typeof record === "string") {
        return record;
      }

      const w =
        record.wins ??
        record.win ??
        0;

      const l =
        record.losses ??
        record.loss ??
        0;

      const t =
        record.ties ??
        record.tie ??
        0;

      return `${w}-${l}-${t}`;
    }


    function qualStatusRecord(status) {
      return recordText(
        status?.qual?.ranking?.record ||
        status?.qual?.record ||
        status?.record
      );
    }

    function playoffOverallStatusRecord(status) {
      return recordText(
        status?.playoff?.record
      );
    }

    function playoffCurrentLevelStatusRecord(status) {
      return recordText(
        status?.playoff?.current_level_record
      );
    }

    function playoffDoubleElimRound(status) {
      return status?.playoff?.double_elim_round;
    }

    function rankText(status) {
      const rank = status?.qual?.ranking?.rank ??
             status?.qual?.rank ??
             status?.rank ??
             "—";
      const numTeams = status?.qual?.num_teams ?? "—";
      return `${rank} of ${numTeams}`;
    }


    function allianceText(status) {
      const alliance =
        status?.alliance;

      if (!alliance) {
        return "Did not qualify for playoffs";
      }
      const allianceStr = status.alliance_status_str
      return `${allianceStr}`;
    }


    function playoffAllianceFromStatistics(statistics) {
      const alliances = statistics?.alliances;

      if (!Array.isArray(alliances)) {
        return null;
      }

      const alliance = alliances.find(item =>
        Array.isArray(item?.picks) &&
        item.picks.includes(team)
      );

      return alliance?.name || null;
    }


    function statisticValue(statistics, category) {
      const values = statistics?.oprs?.[category];

      if (!values || typeof values !== "object") {
        return null;
      }

      const value = values[team];

      return value == null ? null : Number(value);
    }


    function formatStatistic(value) {
      return Number.isFinite(value) ? value.toFixed(2) : "—";
    }


    function coprEntries(statistics) {
      const coprs = statistics?.coprs;

      if (!coprs || typeof coprs !== "object") {
        return [];
      }

      return Object.entries(coprs)
        .map(([name, values]) => ({
          name,
          value:
            values && typeof values === "object"
              ? Number(values[team])
              : NaN
        }))
        .filter(item => Number.isFinite(item.value));
    }


    function playoffAllianceCard(statistics) {
      const alliances = statistics?.alliances;

      if (!Array.isArray(alliances)) {
        return `
          <div class="robot-season-results__event-card">
            <span class="robot-season-results__label">
              Playoff Alliance
            </span>
            <div>Playoff alliance data unavailable.</div>
          </div>
        `;
      }

      const alliance = alliances.find(item =>
        Array.isArray(item?.picks) &&
        item.picks.includes(team)
      );

      if (!alliance) {
        return `
          <div class="robot-season-results__event-card">
            <span class="robot-season-results__label">
              Playoff Alliance
            </span>
            <div>Did not qualify for playoffs</div>
          </div>
        `;
      }

      const teams = alliance.picks || [];

      return `
        <div class="robot-season-results__event-card">
          <span class="robot-season-results__label">
            ${esc(alliance.name || "Playoff Alliance")}
          </span>

          <div class="robot-season-results__alliance-teams">
            ${teams.map(teamKey => {
              const number = String(teamKey).replace(/^frc/, "");
              const isTeam = number === teamNumber;

              return `
                <a
                  href="https://www.thebluealliance.com/team/${esc(number)}/${esc(year)}#${statistics?.event_key || ""}"
                  class="${isTeam ? "robot-season-results__alliance-team is-team" : "robot-season-results__alliance-team"}"
                  target="_blank"
                  rel="noopener noreferrer"
                  ${isTeam ? 'aria-current="page"' : ""}
                >
                  ${isTeam ? `<strong>${esc(number)}</strong>` : esc(number)}
                </a>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function coprCard(statistics) {
      const entries = coprEntries(statistics);

      if (!entries.length) {
        return `
          <div class="robot-season-results__event-card">
            <span class="robot-season-results__label">
              Component OPR
            </span>
            <div>No component statistics available.</div>
          </div>
        `;
      }

      return `
        <div class="robot-season-results__event-card">
          <span class="robot-season-results__label">
            Component OPR
          </span>

          <div class="robot-season-results__copr-list">
            ${entries.map(item => `
              <div class="robot-season-results__copr-row">
                <span>${esc(item.name)}</span>
                <strong>${esc(formatStatistic(item.value))}</strong>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }


    /*
     * TBA supplies this as preformatted HTML.
     *
     * Do NOT escape overall_status_str.
     */
    function eventResult(status) {
      return status?.overall_status_str ||
             status?.playoff?.status ||
             status?.playoff?.result ||
             "Event complete";
    }


    function eventAwards(awards, eventKey) {
      return awards.filter(award =>
        award.event_key === eventKey &&
        (award.recipient_list || []).some(recipient => recipient.team_key === team)
      );
    }


    function highestScoringMatch(matches) {
      return matches.reduce((best, match) => {
        const side = robotMatchTable.teamSide(match, team);
        const score = Number(side?.own?.score);

        return side && Number.isFinite(score) && (!best || score > best.score)
          ? { match, side, score }
          : best;
      }, null);
    }


    function highScoreCard(matches, event) {
      const highest = highestScoringMatch(matches);

      if (!highest) {
        return `
          <div class="robot-season-results__high-score">
            <span class="robot-season-results__label">Highest Scoring Match</span>
            <p class="mb-0">No match data available.</p>
          </div>
        `;
      }

      const video = (highest.match.videos || [])
        .find(item => item.type === "youtube" && item.key);

      return `
        <div class="robot-season-results__high-score">
          <span class="robot-season-results__label">Highest Scoring Match</span>
          <h5 class="mb-1">${esc(robotMatchTable.matchLabel(highest.match))}</h5>
          ${robotMatchBreakdown.render(highest.match, team, {
            eventName: event?.name || event?.key,
            matchName: robotMatchTable.matchLabel(highest.match),
            height: "short",
            info: false
          })}
          ${video ? `
            <div class="embed-responsive embed-responsive-16by9">
              <iframe class="embed-responsive-item"
                src="https://www.youtube-nocookie.com/embed/${esc(video.key)}"
                title="Highest scoring match video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>` : ""}
        </div>
      `;
    }


    function eventTypeBadge(event) {
      const type =
        event?.event_type;

      const week =
        Number.isFinite(Number(event?.week))
          ? `Week ${Number(event.week) + 1} `
          : "";

      const badges = {
        100: { label: "Preseason Event", className: "badge-secondary" },
        99: { label: "Offseason Event", className: "badge-secondary" },
        0: { label: `${week}Regional Event`, className: "badge-primary" },
        1: { label: `${week}District Event`, className: "badge-primary" },
        2: { label: "District Championship", className: "badge-info" },
        3: { label: "FIRST Championship Division", className: "badge-success" },
        4: { label: "FIRST Championship Playoffs", className: "badge-success" },
        5: { label: "District Championship Division", className: "badge-info" },
        7: { label: "2020/21 Remote Event", className: "badge-danger" }
      };

      return badges[type] || null;
    }


    /* ============================================================
       Event card
       ============================================================ */

    function card(event, status, matches, awards, statistics) {
      const rank =
        rankText(status);

      const record =
        qualStatusRecord(status);

      const result =
        eventResult(status);

      const playoffAlliance =
        allianceText(status);

      const opr =
        statisticValue(statistics, "oprs");

      const dpr =
        statisticValue(statistics, "dprs");

      const ccwm =
        statisticValue(statistics, "ccwms");

      const startDate =
        event?.start_date
          ? new Date(
              `${event.start_date}T00:00:00`
            ).toLocaleDateString()
          : "Date unavailable";

      const endDate =
        event?.end_date
          ? new Date(
              `${event.end_date}T00:00:00`
            ).toLocaleDateString()
          : "Date unavailable";

      const location =
        [
          event?.city,
          event?.state_prov,
          event?.country
        ]
        .filter(Boolean)
        .join(", ");

      const badge =
        eventTypeBadge(event);

      const awardsWon =
        eventAwards(awards, event?.key);

      return `
        <article class="robot-season-results__event">

          <div
            class="robot-season-results__summary"
            role="button"
            tabindex="0"
            aria-expanded="false"
          >

            <div>
              <div class="robot-season-results__name">
                ${esc(event?.name || event?.key)}

                ${
                  badge
                      ? `<span class="badge badge-pill ${badge.className} mt-1 ml-1">
                        ${esc(badge.label)}
                      </span>`
                    : ""
                }
              </div>
              <div class="robot-season-results__meta">
                ${esc(location)} · ${esc(startDate)} - ${esc(endDate)}
              </div>
            </div>

            <div>
              <span class="robot-season-results__label">
                Qual Rank
              </span>

              <strong>
                ${esc(rank)}
              </strong>
            </div>

            <div>
              <span class="robot-season-results__label">
                Qual Record
              </span>

              <strong>
                ${esc(record)}
              </strong>
            </div>

            <div>
              <span class="robot-season-results__label">
                Playoff Alliance
              </span>

              <strong>
                ${playoffAlliance}
              </strong>
            </div>

            <div>
              <span class="robot-season-results__label">
                Playoff Record
              </span>

              <strong>
                ${playoffOverallStatusRecord(status)}
              </strong>
            </div>

            <i class="robot-season-results__chevron fa fa-chevron-down" aria-hidden="true"></i>

          </div>

          <!-- Begin inside of collapse -->
          <div class="robot-season-results__body">

            <div class="row mb-3">
              <div class="col-xs-12 col-md-5 p-sm-10">
                <div class="robot-season-results__event-card">
                  <span class="robot-season-results__label">Event Result</span>
                  <div>${result}</div>
                </div>
              </div>

              <div class="col-sm-auto col-md-2">
                ${playoffAllianceCard(statistics)}
              </div>

              <div class="col-sm-auto col-md-2">
                <div class="robot-season-results__event-card">
                  <span class="robot-season-results__label">Awards Won</span>
                  ${awardsWon.length
                    ? `<ul class="mb-0 pl-3">${awardsWon.map(award => `<li>${esc(award.name)}</li>`).join("")}</ul>`
                    : "<div>No awards won</div>"}
                </div>
              </div>

              <div class="col-sm-auto col-md-1">
                <div class="robot-season-results__event-card">
                  <span class="robot-season-results__label">OPR</span>
                  <strong>${esc(formatStatistic(opr))}</strong>
                </div>
              </div>

              <div class="col-sm-auto col-md-1">
                <div class="robot-season-results__event-card">
                  <span class="robot-season-results__label">DPR</span>
                  <strong>${esc(formatStatistic(dpr))}</strong>
                </div>
              </div>

              <div class="col-sm-auto col-md-1">
                <div class="robot-season-results__event-card">
                  <span class="robot-season-results__label">CCWM</span>
                  <strong>${esc(formatStatistic(ccwm))}</strong>
                </div>
              </div>
            </div>

            <!-- <div class="row mb-3">
              <div class="col-md-6">
                ${coprCard(statistics)}
              </div>
            </div> -->

            <div class="row">
              <div class="col-md-6 mb-3 mb-md-0">
                <div class="robot-season-results__event-card">
                  <span class="robot-season-results__label">Match Schedule</span>
                  <br>
                  ${robotMatchTable.rows(matches, team, year) || `
                    <div class="robot-season-results__empty">
                      No match data available.
                    </div>
                  `}
                </div>
              </div>
              <div class="col-md-6">
                ${highScoreCard(matches, event)}
              </div>
            </div>

          </div>

        </article>
      `;
    }


    /* ============================================================
       Load data
       ============================================================ */

    Promise.all([
      fetch(urls.events).then(r => r.json()),
      fetch(urls.statuses).then(r => r.json()),
      fetch(urls.matches).then(r => r.json()),
      fetch(urls.awards).then(r => r.json())
    ])

    .then(async ([events, statuses, matches, awards]) => {

      const statusMap =
        statuses || {};

      const teamEvents =
        events.filter(event =>
          statusMap[event.key] != null ||
          matches.some(
              m =>
              m.event_key === event.key &&
              robotMatchTable.teamSide(m, team)
          )
        );


      teamEvents.sort(
        (a, b) =>
          String(a.start_date || "")
            .localeCompare(
              String(b.start_date || "")
            )
      );


      if (!teamEvents.length) {
        output.innerHTML = `
          <div class="robot-season-results__empty">
            No events found.
          </div>
        `;

        return;
      }


      const statisticsResults =
        await Promise.allSettled(
          teamEvents.map(event =>
            fetch(urls.statistics(event.key))
              .then(response => {
                if (!response.ok) {
                  throw new Error(
                    `HTTP ${response.status}`
                  );
                }

                return response.json();
              })
          )
        );

      const statisticsMap = {};

      teamEvents.forEach((event, index) => {
        const result = statisticsResults[index];

        statisticsMap[event.key] =
          result.status === "fulfilled"
            ? result.value
            : null;
      });


      output.innerHTML =
        teamEvents
          .map(event => {

            const eventMatches =
              matches
                .filter(
                  m =>
                    m.event_key === event.key
                )
                .filter(
                  m =>
                    robotMatchTable.teamSide(m, team)
                )
                .sort(
                  (a, b) =>
                    (a.time || 0) -
                    (b.time || 0)
                );

            return card(
              event,
              statusMap[event.key] || {},
              eventMatches,
              awards || [],
              statisticsMap[event.key]
            );
          })
          .join("");


      /* ==========================================================
         Event accordion
         ========================================================== */

      output
        .querySelectorAll(
          ".robot-season-results__summary"
        )
        .forEach(summary => {

          const toggle = () => {

            const event =
              summary.closest(
                ".robot-season-results__event"
              );

            const open =
              event.classList.toggle(
                "is-open"
              );

            summary.setAttribute(
              "aria-expanded",
              open ? "true" : "false"
            );
          };


          summary.addEventListener(
            "click",
            toggle
          );


          summary.addEventListener(
            "keydown",
            e => {

              if (
                e.key === "Enter" ||
                e.key === " "
              ) {
                e.preventDefault();
                toggle();
              }

            }
          );

        });

    })

    .catch(error => {

      console.error(
        "Robot season results:",
        error
      );

      output.innerHTML = `
        <div class="robot-season-results__empty">
          Unable to load event results.
        </div>
      `;

    });

  })();
  </script>
</section>
