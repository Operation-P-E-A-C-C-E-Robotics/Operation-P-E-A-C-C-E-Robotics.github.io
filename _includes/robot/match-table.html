<style>
  .robot-season-results__matches {
    width: 100%;
    max-width: 72rem;
    margin-inline: auto;
    font-family: "Roboto Variable", sans-serif;
    font-size: .875rem;
    line-height: calc(1.25 / .875);
    font-variant-numeric: lining-nums tabular-nums;
  }

  .robot-season-results__match {
    --robot-foreground: oklch(23.93% 0 0);
    --robot-neutral-50: oklch(98.5% 0 0);
    --robot-red-winner: oklch(83.2852% .085938 29);
    --robot-red-loser: oklch(91.0855% .04375 29);
    --robot-blue-winner: oklch(82.4681% .085938 264);
    --robot-blue-loser: oklch(90.6397% .04375 264);
    display: grid;
    margin-bottom: .5rem;
    grid-template-columns: 2.5em 9em repeat(8, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    gap: 2px;
    width: 100%;
    background: var(--robot-neutral-50);
    color: var(--robot-foreground);
    font-family: "Roboto Variable", sans-serif;
    font-size: .875rem;
    line-height: calc(1.25 / .875);
    font-variant-numeric: lining-nums tabular-nums;
    box-sizing: border-box;
  }

  .robot-season-results__match-video {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    background: var(--robot-neutral-50);
    border-radius: .625rem 0 0 .625rem;
  }

  .robot-season-results__match-video a {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-inline: .5rem;
    color: inherit;
    text-decoration: none;
  }

  .robot-season-results__match-video svg {
    width: 1.2em;
    height: 1.2em;
  }

  .robot-season-results__match-name {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    box-sizing: border-box;
    padding: .375rem .75rem .375rem .375rem;
    background: var(--robot-neutral-50);
    text-align: center;
  }

  .robot-season-results__match-name a {
    display: block;
    min-width: 0;
    max-width: 100%;
    color: var(--robot-foreground);
    text-decoration: none;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .robot-season-results__match-name a:hover {
    text-decoration: underline;
  }

  .robot-season-results__red-teams,
  .robot-season-results__blue-teams {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    min-width: 0;
    grid-column: span 3;
  }

  .robot-season-results__team {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: .375rem;
    text-align: center;
    box-sizing: border-box;
  }

  .robot-season-results__team a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    color: var(--robot-foreground);
    text-decoration: none;
  }

  .robot-season-results__team a:hover {
    text-decoration: underline;
  }

  .robot-season-results__team--3461 a {
    font-weight: 700;
  }

  .robot-season-results__red-winner { background-color: oklch(83.2852% .085938 29); }
  .robot-season-results__red-loser { background-color: oklch(91.0855% .04375 29); }
  .robot-season-results__blue-winner { background-color: oklch(82.4681% .085938 264); }
  .robot-season-results__blue-loser { background-color: oklch(90.6397% .04375 264); }

  .robot-season-results__score {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: .375rem;
    font-variant-numeric: lining-nums tabular-nums;
    box-sizing: border-box;
  }

  .robot-season-results__score--red { color: oklch(44.4% .177 26.899); }
  .robot-season-results__score--blue { color: oklch(42.4% .199 265.638); }
  .robot-season-results__score.is-winner { font-weight: 700; }
  .robot-season-results__red-score { grid-column: 9; grid-row: 1; border-radius: .5rem 0 0 .5rem; }
  .robot-season-results__blue-score { grid-column: 10; grid-row: 1; border-radius: 0 .5rem .5rem 0; }

  .robot-season-results__red-teams .robot-season-results__team:first-child { border-radius: .625rem 0 0 .625rem; }
  .robot-season-results__blue-teams .robot-season-results__team:last-child { border-radius: 0 .625rem .625rem 0; }

  @media (max-width: 991.98px) {
    .robot-season-results__match {
      grid-template-columns: 2.5em 9em repeat(4, minmax(0, 1fr));
      grid-template-rows: 2em 2em;
    }

    .robot-season-results__match-video { grid-column: 1; grid-row: 1 / span 2; }
    .robot-season-results__match-name { grid-column: 2; grid-row: 1 / span 2; }
    .robot-season-results__red-teams { grid-column: 3 / span 3; grid-row: 1; padding-top: 2px; }
    .robot-season-results__blue-teams { grid-column: 3 / span 3; grid-row: 2; padding-bottom: 2px; }
    .robot-season-results__red-score { grid-column: 6; grid-row: 1; border-radius: 0 .5rem 0 0; }
    .robot-season-results__blue-score { grid-column: 6; grid-row: 2; border-radius: 0 0 .5rem 0; }
    .robot-season-results__red-teams .robot-season-results__team:first-child { border-radius: .625rem 0 0 0; }
    .robot-season-results__red-teams .robot-season-results__team:last-child { border-radius: 0 .625rem 0 0; }
    .robot-season-results__blue-teams .robot-season-results__team:first-child { border-radius: 0 0 0 .625rem; }
    .robot-season-results__blue-teams .robot-season-results__team:last-child { border-radius: 0 0 .625rem 0; }
  }

  @media (max-width: 575.98px) {
    .robot-season-results__match {
      grid-template-columns: 2.5em 7em repeat(4, minmax(0, 1fr));
      font-size: .8rem;
    }
  }
</style>

<script>
  window.robotMatchTable = window.robotMatchTable || (() => {
    const esc = value => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const matchLabel = match => {
      if (match.comp_level === "qm") return `Quals ${match.match_number}`;
      if (match.comp_level === "ef") return `Eighthfinal ${match.set_number}-${match.match_number}`;
      if (match.comp_level === "qf") return `Quarterfinal ${match.set_number}-${match.match_number}`;
      if (match.comp_level === "sf") return `Semifinals ${match.set_number}-${match.match_number}`;
      if (match.comp_level === "f") return `Final ${match.match_number}`;
      return `${match.comp_level || "?"}-${match.match_number ?? "?"}`;
    };

    const teamSide = (match, team) => {
      for (const alliance of ["red", "blue"]) {
        const side = match.alliances?.[alliance];
        if (side?.team_keys?.includes(team)) {
          return { alliance: alliance[0].toUpperCase() + alliance.slice(1), own: side, opp: match.alliances[alliance === "red" ? "blue" : "red"] };
        }
      }
      return null;
    };

    const winningAlliance = match => {
      const red = Number(match.alliances?.red?.score);
      const blue = Number(match.alliances?.blue?.score);
      if (!Number.isFinite(red) || !Number.isFinite(blue)) return null;
      return red > blue ? "Red" : blue > red ? "Blue" : null;
    };

    const teamLink = (number, team, year) => {
      const cleanNumber = String(number).replace(/^frc/, "");
      return `<a href="https://www.thebluealliance.com/team/${esc(cleanNumber)}/${esc(year)}" target="_blank" rel="noopener noreferrer"${cleanNumber === team.replace(/^frc/, "") ? 'aria-current="page"' : ""}>${cleanNumber === team.replace(/^frc/, "") ? `<strong>${esc(cleanNumber)}</strong>` : esc(cleanNumber)}</a>`;
    };

    const teamCells = (teamKeys, alliance, winner, team, year) => {
      const name = alliance.toLowerCase();
      const background = winner === alliance ? `robot-season-results__${name}-winner` : `robot-season-results__${name}-loser`;
      return `<div class="robot-season-results__${name}-teams">${teamKeys.map(key => {
        const number = String(key).replace(/^frc/, "");
        return `<div class="robot-season-results__team${number === team.replace(/^frc/, "") ? " robot-season-results__team--3461" : ""} ${background}">${teamLink(number, team, year)}</div>`;
      }).join("")}</div>`;
    };

    const scoreCell = (score, alliance, winner) => {
      const name = alliance.toLowerCase();
      const isWinner = winner === alliance;
      const background = isWinner ? `robot-season-results__${name}-winner` : `robot-season-results__${name}-loser`;
      return `<div class="robot-season-results__score robot-season-results__${name}-score ${background} robot-season-results__score--${name}${isWinner ? " is-winner" : ""}">${esc(score)}</div>`;
    };

    const matchVideo = (match, year) => {
      const video = (match.videos || []).find(item => item?.type === "youtube" && item.key);
      return video ? `<a rel="noopener noreferrer" href="https://www.youtube.com/watch?v=${esc(video.key)}" target="_blank" aria-label="Watch ${esc(matchLabel(match))}"><svg viewBox="0 0 24 24" width="1.2em" height="1.2em"><path fill="currentColor" d="M12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8s8 3.59 8 8s-3.59 8-8 8m0-18A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m-2 14.5l6-4.5l-6-4.5z"></path></svg></a>` : "";
    };

    const rows = (matches, team, year) => matches.map(match => {
      if (!teamSide(match, team)) return "";
      const winner = winningAlliance(match);
      const red = match.alliances?.red?.team_keys || [];
      const blue = match.alliances?.blue?.team_keys || [];
      const key = match.key || `${match.event_key}_${match.comp_level}_${match.match_number}`;
      return `<div class="robot-season-results__match"><div class="robot-season-results__match-video">${matchVideo(match, year)}</div><div class="robot-season-results__match-name"><a href="https://www.thebluealliance.com/match/${esc(key)}" target="_blank" rel="noopener noreferrer">${esc(matchLabel(match))}</a></div>${teamCells(red, "Red", winner, team, year)}${teamCells(blue, "Blue", winner, team, year)}${scoreCell(match.alliances?.red?.score ?? "—", "Red", winner)}${scoreCell(match.alliances?.blue?.score ?? "—", "Blue", winner)}</div>`;
    }).join("");

    return { esc, matchLabel, teamSide, winningAlliance, rows };
  })();
</script>
