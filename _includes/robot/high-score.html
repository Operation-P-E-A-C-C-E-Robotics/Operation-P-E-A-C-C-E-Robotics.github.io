<section class="robot-high-score mb-5" data-year="{{ include.year }}" data-team="{{ include.team }}">
  <style>
    .robot-high-score__card {
      background: #f8f9fa;
      border: 1px solid rgba(0,0,0,.125);
      border-radius: .25rem;
      padding: 1.5rem;
    }

    .robot-high-score__alliance {
      color: #fff;
      padding: .75rem;
      box-sizing: border-box;
      width: 100%;
    }

    .robot-high-score__red,
    .robot-high-score__blue {
      display: grid;
      align-items: stretch;
    }

    .robot-high-score__red {
      background: #dc3545;
      border-radius: .25rem 0 0 .25rem;
      grid-template-columns: 1fr auto;
      column-gap: 1rem;
    }

    .robot-high-score__blue {
      background: #007bff;
      border-radius: 0 .25rem .25rem 0;
      grid-template-columns: auto 1fr;
      column-gap: 1rem;
    }

    .robot-high-score__teams {
      display: flex;
      align-items: flex-start;
    }

    .robot-high-score__blue .robot-high-score__teams {
      justify-content: flex-end;
      text-align: right;
    }

    .robot-high-score__score {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 .5rem;
    }

    /* Make all three boxes the same height */
    .robot-high-score .row {
      display: flex;
      align-items: stretch;
    }

    .robot-high-score .row > [class*="col-"] {
      display: flex;
    }

    .robot-high-score .row > [class*="col-"] > .robot-high-score__alliance {
      flex: 1;
    }
  </style>

  <div id="robotHighScore-{{ include.year }}" class="robot-high-score__card">
    <h2>Highest Scoring Match</h2>
    <div class="text-muted">Loading…</div>
  </div>

  <script>
  (() => {
    const year = "{{ include.year}}";
    const team = "{{ include.team}}";
    const base = "{{ '/data/tba/' | relative_url }}";
    const output = document.getElementById(`robotHighScore-${year}`);

    const matchName = match => {
      if (match.comp_level === "qm") return `Qualification Match ${match.match_number}`;
      if (match.comp_level === "qf") return `Quarterfinal ${match.set_number} Match ${match.match_number}`;
      if (match.comp_level === "sf") return `Semifinal ${match.set_number} Match ${match.match_number}`;
      if (match.comp_level === "f") return `Final ${match.match_number}`;
      return `${match.comp_level || "Match"} ${match.match_number}`;
    };

    fetch(`${base}${year}_matches.json`)
      .then(r => r.json())
      .then(matches => {
        let best = null;
        let bestScore = -Infinity;

        matches.forEach(match => {
          for (const color of ["red", "blue"]) {
            const alliance = match.alliances?.[color];
            if (alliance?.team_keys?.includes(team) && alliance.score > bestScore) {
              best = match;
              bestScore = alliance.score;
            }
          }
        });

        if (!best) {
          output.innerHTML = `<h2>Highest Scoring Match</h2><p>No match data available.</p>`;
          return;
        }

        return fetch(`${base}${year}_events.json`).then(r => r.json()).then(events => {
          const event = events.find(e => e.key === best.event_key);
          const teamList = alliance =>
            alliance.team_keys.map(k => {
              const n = k.replace(/^frc/, "");
              return k === team ? `<strong>${n}</strong>` : n;
            }).join(" · ");

          output.innerHTML = `
            <h2>Highest Scoring Match</h2>
            <div class="row align-items-stretch h-100">
              <div class="col-md-3 pr-0">
                <div class="robot-high-score__alliance robot-high-score__red">
                  <div class="robot-high-score__teams d-block mb-0">
                    <h5>${teamList(best.alliances.red)}</h5>
                    <h6 class="mb-0">
                      Auto: ${best.score_breakdown.red.totalAutoPoints}
                       · 
                      Teleop: ${best.score_breakdown.red.totalTeleopPoints}
                       · 
                      Penalty: ${best.score_breakdown.red.foulPoints}
                    </h6>
                  </div>

                  <div class="robot-high-score__score">
                    <h3 class="mb-0">${best.alliances.red.score}</h3>
                  </div>
                </div>
              </div>
              <div class="col-md-6 p-0">
                <div class="robot-high-score__alliance robot-high-score bg-dark text-light text-center">
                  <h5>${event?.name || best.event_key}</h5>
                  <h6 class="mb-0">${matchName(best)}</h6>
                </div>
              </div>
              <div class="col-md-3 pl-0 text-right">
                <div class="robot-high-score__alliance robot-high-score__blue">
                  <div class="robot-high-score__score">
                    <h3 class="mb-0">${best.alliances.blue.score}</h3>
                  </div>

                  <div class="robot-high-score__teams d-block">
                    <h5>${teamList(best.alliances.blue)}</h5>
                    <h6 class="mb-0">
                      Auto: ${best.score_breakdown.blue.totalAutoPoints}
                       · 
                      Teleop: ${best.score_breakdown.blue.totalTeleopPoints}
                       · 
                      Penalty: ${best.score_breakdown.blue.foulPoints}
                    </h6>
                  </div>
                </div>
              </div>
            </div>
            ${best.videos?.[0]?.key ? `
              <div class="embed-responsive embed-responsive-16by9 mt-3">
                <iframe class="embed-responsive-item"
                  src="https://www.youtube-nocookie.com/embed/${best.videos[0].key}"
                  title="Highest scoring match video"
                  allowfullscreen></iframe>
              </div>` : ""}
          `;
        });
      })
      .catch(error => {
        console.error("Robot high score:", error);
        output.innerHTML = `<h2>Highest Scoring Match</h2><p>Unable to load match data.</p>`;
      });
  })();
  </script>
</section>
