name: Update current event snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-current-event:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data/tba/tba-requirements.txt

      - name: Update current event data
        env:
          TBA_API_KEY: ${{ secrets.tba_api_key }}
          TEAM: frc3461
        run: |
          export YEAR=$(date +%Y)
          python updateCurrentEvent.py
        working-directory: data/tba

      - name: Commit updated current event snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update current event snapshot"
          file_pattern: data/tba/current_event.json
