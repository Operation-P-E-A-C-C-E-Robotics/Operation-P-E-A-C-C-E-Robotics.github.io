on:
    schedule:
        - cron: '0 0/1 * 1-4 *'
        - cron: '0 0 * 4-12 *'

    workflow_dispatch:

concurrency:
  group: tba-data-writers
  cancel-in-progress: false


name: Update the TBA /status endpoint to get the current and max seasons
jobs:
    Execute-Python-Script:
        runs-on: ubuntu-latest
        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
            contents: write
        steps:
            - name: checkout repo content
            uses: actions/checkout@v4
              with:
                sparse-checkout: data/tba
                sparse-checkout-cone-mode: true

            - name: setup python
            uses: actions/setup-python@v5
              with:
                python-version: 3.8 #install the python needed
            - name: update pip
              run: |
                pip install --upgrade pip
            - name: install python dependencies
              run: |
                pip install -r data/tba/tba-requirements.txt
            - name: execute python script # run the run.py to get the latest data
              run: |
                python updateTBAStatus.py
              working-directory: data/tba
              env:
                TBA_API_KEY: ${{ secrets.tba_api_key }} # if run.py requires passwords..etc, set it as secrets

            - name: Commit Files
              uses: stefanzweifel/git-auto-commit-action@v4
              with:
                commit_message: Update TBA status data
                file_pattern: data/tba/status.json
